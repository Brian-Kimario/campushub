# CampusHub local stack (DEPLOYMENT §2). Requires a local .env file; copy .env.example and generate real secrets.
# Images are pinned by digest (ADR-022, CI_CD). Update the digest deliberately, never by tag alone.

services:
  mysql:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_DATABASE: ${CAMPUSHUB_DB_NAME:-campushub}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      CAMPUSHUB_DB_APP_USER: ${CAMPUSHUB_DB_APP_USER:?Set CAMPUSHUB_DB_APP_USER in .env}
      CAMPUSHUB_DB_APP_PASSWORD: ${CAMPUSHUB_DB_APP_PASSWORD:?Set CAMPUSHUB_DB_APP_PASSWORD in .env}
      CAMPUSHUB_DB_MIGRATION_USER: ${CAMPUSHUB_DB_MIGRATION_USER:?Set CAMPUSHUB_DB_MIGRATION_USER in .env}
      CAMPUSHUB_DB_MIGRATION_PASSWORD: ${CAMPUSHUB_DB_MIGRATION_PASSWORD:?Set CAMPUSHUB_DB_MIGRATION_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./infra/docker/data/mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: ./backend
    env_file: .env
    environment:
      # Compose network host name; overrides the localhost default in .env.
      CAMPUSHUB_DB_HOST: mysql
      # Used only when CAMPUSHUB_KAFKA_ENABLED=true and the kafka profile is running.
      CAMPUSHUB_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - storage:/var/campushub/storage

  # Optional event broker (ADR-011). Start with: docker compose --profile kafka up -d
  # Single node, KRaft mode, no ZooKeeper. The image is pinned by digest, like the others.
  kafka:
    profiles: ["kafka"]
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "127.0.0.1:9092:9092"

volumes:
  storage:
